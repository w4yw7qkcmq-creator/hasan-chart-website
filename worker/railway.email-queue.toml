# HasaN CharT World — email queue worker
# Railway: Root Directory = worker | Config File = worker/railway.email-queue.toml

[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.email-queue.toml"

[deploy]
startCommand = "npm run email-queue-worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
