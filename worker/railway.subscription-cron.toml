# Subscription maintenance cron — Railway service: "Subscription Worker" (Cron Job)
# Root Directory = worker | Config File = railway.subscription-cron.toml
# Runs maintenance directly in-process (no always-on HTTP API hop).

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "SUBSCRIPTION_WORKER_ONESHOT=true node subscription-maintenance-worker.js"
cronSchedule = "*/15 * * * *"
restartPolicyType = "NEVER"
