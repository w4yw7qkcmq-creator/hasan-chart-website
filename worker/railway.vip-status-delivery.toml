# HasaN CharT World — VIP status delivery worker
# Railway: Root Directory = worker | Config File = worker/railway.vip-status-delivery.toml

[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.vip-status-delivery.toml"

[deploy]
startCommand = "npm run vip-status-delivery-worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
