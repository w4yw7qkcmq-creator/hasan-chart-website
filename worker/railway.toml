# HasaN CharT World — price alerts worker (Railway service: hasan-chart-worker)
# Root Directory = worker | Config File = railway.toml (default)

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
EMAIL_FROM = "HasaN CharT Alerts <alerts@hasanchartworld.com>"
EMAIL_REPLY_TO = "support@hasanchartworld.com"
NEXT_PUBLIC_SITE_URL = "https://www.hasanchartworld.com"
