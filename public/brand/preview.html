<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>HasaN CharT — Original Logo Preview</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #111827; color: #fff; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #94a3b8; margin: 0 0 24px; line-height: 1.7; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    .card { background: #1f2937; border: 1px solid #374151; border-radius: 16px; padding: 20px; }
    .sizes { display: flex; align-items: end; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
    .size { text-align: center; }
    .size span { display: block; font-size: 12px; color: #94a3b8; margin-top: 8px; }
    img, object { display: block; border-radius: 999px; }
  </style>
</head>
<body>
  <h1>معاينة الشعار الأصلي (بدون إعادة تصميم)</h1>
  <p>الملفات SVG أدناه تعرض الصورة الأصلية كما هي عبر <code>&lt;image&gt;</code> — بدون تعديل على الشكل.</p>
  <div class="grid">
    <div class="card">
      <strong>hasan-chart-original.png</strong>
      <div class="sizes">
        <div class="size"><img src="./hasan-chart-original.png" width="256" height="256" alt="Original PNG" /><span>256px</span></div>
        <div class="size"><img src="./hasan-chart-original.png" width="128" height="128" alt="Original PNG" /><span>128px</span></div>
        <div class="size"><img src="./hasan-chart-original.png" width="48" height="48" alt="Original PNG" /><span>48px</span></div>
        <div class="size"><img src="./hasan-chart-original.png" width="32" height="32" alt="Original PNG" /><span>32px</span></div>
      </div>
    </div>
    <div class="card">
      <strong>hasan-chart-email.svg</strong>
      <div class="sizes">
        <div class="size"><img src="./hasan-chart-email.svg" width="256" height="256" alt="Email SVG" /><span>256px</span></div>
        <div class="size"><img src="./hasan-chart-email.svg" width="128" height="128" alt="Email SVG" /><span>128px</span></div>
        <div class="size"><img src="./hasan-chart-email.svg" width="48" height="48" alt="Email SVG" /><span>48px</span></div>
        <div class="size"><img src="./hasan-chart-email.svg" width="32" height="32" alt="Email SVG" /><span>32px</span></div>
      </div>
    </div>
    <div class="card">
      <strong>hasan-chart-bimi.svg</strong>
      <div class="sizes">
        <div class="size"><img src="./hasan-chart-bimi.svg" width="256" height="256" alt="BIMI SVG" /><span>256px</span></div>
        <div class="size"><img src="./hasan-chart-bimi.svg" width="128" height="128" alt="BIMI SVG" /><span>128px</span></div>
        <div class="size"><img src="./hasan-chart-bimi.svg" width="48" height="48" alt="BIMI SVG" /><span>48px</span></div>
        <div class="size"><img src="./hasan-chart-bimi.svg" width="32" height="32" alt="BIMI SVG" /><span>32px</span></div>
      </div>
    </div>
  </div>
</body>
</html>
